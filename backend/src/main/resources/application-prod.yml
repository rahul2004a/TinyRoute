spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate

tinyroute:
  security:
    allowed-origins: ${ALLOWED_FRONTEND_ORIGINS}
  rate-limit:
    hmac-secret: ${RATE_LIMIT_HMAC_SECRET}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS}
  mail:
    registration-from: ${REGISTRATION_MAIL_FROM}
