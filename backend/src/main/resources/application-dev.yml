spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:tinyroute}
    username: ${POSTGRES_USER:tinyroute}
    password: ${POSTGRES_PASSWORD:local-dev-password}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

tinyroute:
  security:
    allowed-origins: ${ALLOWED_FRONTEND_ORIGINS:https://localhost:3000}
  rate-limit:
    hmac-secret: ${RATE_LIMIT_HMAC_SECRET:local-dev-rate-limit-secret}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32}
  mail:
    registration-from: ${REGISTRATION_MAIL_FROM:no-reply@tinyroute.local}
